let state=load();
function fresh(){return {members:[],points:0,completed:[],events:[],invite:'OG01-'+Math.random().toString(36).slice(2,7).toUpperCase(),created:new Date().toISOString()}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.members)?x:fresh()}catch{return fresh()}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));updatePoints()}
function t(k){return (dict[lang()]||dict['ar-EG'])[k]||dict['ar-EG'][k]||k}
function lang(){return document.getElementById('lang')?.value||'ar-EG'}
let tab='home';
const $=s=>document.querySelector(s);
function updatePoints(){$('#topPoints').textContent=state.points||0}
function notice(msg,type=''){ $('#noticeArea').innerHTML=`<div class="notice ${type}">${esc(msg)}</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function title(){ $('#pageTitle').textContent=t(tab)}
function render(){title();updatePoints();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#content').innerHTML=({home:homeView,family:familyView,games:gamesView,achievements:achievementsView,world:worldView,admin:adminView}[tab]||homeView)();wire(); }
function homeView(){return `<section class="hero"><div><span class="tag">🌱 OSMAR GENERATION 1 · OG.01</span><h1>${t('hello')}<br><em>Learn • Play • Build • Grow</em></h1><p>${t('intro')}</p><button class="btn light" data-go="games">🎮 ${t('play')}</button></div><div class="hero-art">🏡🌳👨‍👩‍👧‍👦</div></section><div class="section"><small>FAMILY OVERVIEW</small><h2>لمّة العيلة 🌿</h2></div><div class="stats"><div class="stat"><span class="ico">👨‍👩‍👧‍👦</span><div><b>${state.members.length}</b><small>${t('members')}</small></div></div><div class="stat"><span class="ico">⭐</span><div><b>${state.points}</b><small>${t('points')} · FWP</small></div></div><div class="stat"><span class="ico">🏅</span><div><b>${state.completed.length}</b><small>${t('doneCount')}</small></div></div></div><div class="section"><small>PLAY & LEARN</small><h2>${t('missions')}</h2></div><div class="grid">${games.slice(0,3).map(gameCard).join('')}</div><div class="notice">${t('warning')}</div>`}
function memberCard(m){return `<article class="person"><div class="avatar">${esc(m.emoji)}</div><h3>${esc(m.name)}</h3><small>${esc(m.role)}</small><b>⭐ ${m.points||0} FWP</b><div style="margin-top:10px"><button class="btn soft small" data-edit="${m.id}">${t('edit')}</button> <button class="btn danger small" data-del="${m.id}">${t('delete')}</button></div></article>`}
function familyView(){return `<div class="row"><div class="section"><small>OUR PEOPLE</small><h2>${t('members')}</h2></div><button class="btn primary" id="addMember">＋ ${t('add')}</button></div>${state.members.length?`<div class="people">${state.members.map(memberCard).join('')}</div>`:`<div class="empty">${t('empty')}</div>`}<div class="section"><small>FAMILY NETWORK</small><h2>${t('map')}</h2></div><div class="map-wrap"><div class="root-node">🌳<b>عيلتنا</b><small>جذورنا واحدة</small></div><div class="map-members">${state.members.map(m=>`<div class="map-node"><span>${esc(m.emoji)}</span><b>${esc(m.name)}</b><small>${esc(m.role)}</small></div>`).join('')}</div></div>`}
function gameCard(g){return `<article class="game"><span class="category">${esc(g.cat)}</span><div class="emoji">${g.icon}</div><h3>${esc(g.title)}</h3><p>${esc(g.desc)}</p><div class="playrow"><button class="btn soft small" data-game="${g.id}">${t('play')} ←</button><span class="pts">+${g.pts} FWP</span></div></article>`}
function gamesView(){return `<div class="section"><small>FAMILY FUN</small><h2>10 ألعاب عائلية جاهزة للعب 🎮</h2></div><p class="muted">اختاروا لعبة، اقرأوا التعليمات، والعبوا مع بعض. المشاركة والمرح أهم من الفوز.</p><div class="grid">${games.map(gameCard).join('')}</div>`}
function achievementsView(){let badges=[['🤝','روح الفريق','شارك في تحدٍ جماعي'],['📚','باحث المعرفة','جرّب لعبة تفكير أو معرفة'],['💚','صانع اللطف','نفّذ مهمة لطف'],['🌿','حارس النعمة','شارك في عمل بيئي'],['🏡','سند البيت','ساعد في مسؤولية منزلية'],['🎨','مبدع العيلة','شارك في نشاط فني']];return `<div class="section"><small>YOUR PROGRESS</small><h2>${t('achieved')}</h2></div><div class="stats"><div class="stat"><span class="ico">⭐</span><div><b>${state.points}</b><small>FWP</small></div></div><div class="stat"><span class="ico">🎮</span><div><b>${state.completed.length}</b><small>${t('doneCount')}</small></div></div><div class="stat"><span class="ico">🌱</span><div><b>${state.members.length}</b><small>${t('members')}</small></div></div></div><div class="section"><small>BADGES</small><h2>${t('badges')}</h2></div><div class="badges">${badges.map((b,i)=>`<div class="badge"><div class="emoji">${b[0]}</div><b>${b[1]}</b><small>${b[2]}</small></div>`).join('')}</div><div class="notice">${t('pointsNote')}</div>`}
function worldView(){return `<div class="section"><small>OUR SHARED WORLD</small><h2>${t('worlds')} 🌍</h2></div><div class="grid">${worlds.map(w=>`<article class="card"><div style="font-size:30px">${w[0]}</div><h3>${w[1]}</h3><p class="muted">${w[2]}</p></article>`).join('')}</div><div class="notice">${t('backup')}</div>`}
function adminView(){return `<div class="section"><small>LOCAL ADMIN CONSOLE</small><h2>${t('admin')}</h2></div><div class="card panel"><div><b>${t('code')}</b><h2 style="letter-spacing:2px">${state.invite}</h2><small class="muted">${t('codehint')}</small></div><div class="row"><button class="btn primary" id="newCode">توليد كود جديد</button><button class="btn soft" id="export">${t('export')} JSON</button><label class="btn soft" for="importFile">${t('import')} JSON</label><input id="importFile" type="file" accept="application/json" hidden></div><div class="notice">${t('admininfo')} ${t('backup')}</div><div><b>إدارة البيانات</b><p class="muted">يمكنك تعديل أفراد العيلة، وتصدير نسخة احتياطية قبل تغيير الجهاز أو المتصفح.</p><button class="btn danger" id="reset">${t('reset')}</button></div></div>`}
function wire(){
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>openGame(b.dataset.game));
$('#addMember')?.addEventListener('click',()=>memberModal());
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>memberModal(b.dataset.edit));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('متأكد من حذف الفرد؟')){state.members=state.members.filter(m=>m.id!==b.dataset.del);persist();render()}});
$('#newCode')?.addEventListener('click',()=>{state.invite='OG01-'+Math.random().toString(36).slice(2,7).toUpperCase();persist();render();notice('تم إنشاء كود تنظيمي جديد. ليس وسيلة تحقق آمنة.','good')});
$('#export')?.addEventListener('click',exportData);
$('#importFile')?.addEventListener('change',importData);
$('#reset')?.addEventListener('click',()=>{if(confirm('سيتم مسح بيانات هذا المتصفح. هل تريد المتابعة؟')){state=fresh();persist();render();notice('تمت إعادة بيانات التجربة.','good')}});
}
function go(x){tab=x;$('#sidebar').classList.remove('show');render();window.scrollTo(0,0)}
function openGame(id){let g=games.find(x=>x.id===id);if(!g){notice(t('notfound'),'bad');return}$('#modalHost').innerHTML=`<div class="modal-back" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="row"><h3>${g.icon} ${esc(g.title)}</h3><button class="btn soft small" id="closeModal">×</button></div><p class="muted">${esc(g.desc)}</p><b>${t('how')}</b><p style="line-height:2">${esc(g.how)}</p><div class="notice">${t('started')} · +${g.pts} FWP</div><div class="modal-actions"><button class="btn primary" id="completeGame">${t('done')}</button><button class="btn soft" id="closeModal2">${t('close')}</button></div></div></div>`;
const close=()=>$('#modalHost').innerHTML='';$('#closeModal').onclick=close;$('#closeModal2').onclick=close;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};$('#completeGame').onclick=()=>{state.points+=g.pts;state.completed.push({id:g.id,title:g.title,date:new Date().toISOString()});state.events.push({type:'game',title:g.title,points:g.pts,date:new Date().toISOString()});persist();close();render();notice(t('reward'),'good')};}
function memberModal(id){let m=state.members.find(x=>x.id===id)||{id:'',name:'',role:'فرد من العيلة',emoji:'😊',points:0};$('#modalHost').innerHTML=`<div class="modal-back"><form class="modal" id="memberForm"><h3>${id?'تعديل فرد':'إضافة فرد جديد'}</h3><label>${t('name')}<input name="name" required maxlength="40" value="${esc(m.name)}"></label><label>${t('role')}<input name="role" maxlength="40" value="${esc(m.role)}"></label><label>رمز تعبيري<input name="emoji" maxlength="4" value="${esc(m.emoji)}"></label><div class="modal-actions"><button class="btn primary">${t('save')}</button><button type="button" class="btn soft" id="cancelModal">${t('cancel')}</button></div></form></div>`;
$('#cancelModal').onclick=()=>$('#modalHost').innerHTML='';$('#memberForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),item={...m,name:fd.get('name').trim(),role:fd.get('role').trim()||'فرد من العيلة',emoji:fd.get('emoji').trim()||'😊'};if(id)state.members=state.members.map(x=>x.id===id?item:x);else state.members.push({...item,id:'m'+Date.now()});persist();$('#modalHost').innerHTML='';render();notice('تم حفظ بيانات الفرد على هذا الجهاز.','good')}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='family-world-backup.json';a.click();URL.revokeObjectURL(a.href);notice('تم تجهيز نسخة احتياطية.','good')}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.members)||typeof x.points!=='number')throw Error();state=x;persist();render();notice('تم استيراد النسخة الاحتياطية.','good')}catch{notice('ملف النسخة الاحتياطية غير صالح.','bad')}};r.readAsText(f)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('show');
$('#lang').onchange=()=>{let l=lang();document.documentElement.lang=l;document.documentElement.dir=l==='en'||l==='zh'?'ltr':'rtl';render()};
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script></body></html>
