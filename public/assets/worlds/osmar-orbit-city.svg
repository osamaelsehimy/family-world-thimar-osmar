<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">OSMAR Orbit City — Living Sustainable Family World</title>
<desc id="desc">A vast floating green island city surrounded by six luminous orbital districts, connected by transit bridges and sustainable water and energy systems.</desc>
<defs>
 <linearGradient id="space" x2="0" y2="1"><stop stop-color="#06182f"/><stop offset=".55" stop-color="#0b3851"/><stop offset="1" stop-color="#071b31"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#4eac9a" stop-opacity=".32"/><stop offset="1" stop-color="#4eac9a" stop-opacity="0"/></radialGradient>
 <linearGradient id="land" x2=".2" y2="1"><stop stop-color="#d7e7a2"/><stop offset=".35" stop-color="#79b78c"/><stop offset=".72" stop-color="#347c79"/><stop offset="1" stop-color="#173f61"/></linearGradient>
 <linearGradient id="cliff" x2="0" y2="1"><stop stop-color="#7bb99b"/><stop offset=".45" stop-color="#2f7180"/><stop offset="1" stop-color="#102b4c"/></linearGradient>
 <linearGradient id="gold" x2="1"><stop stop-color="#fff0b2"/><stop offset="1" stop-color="#c49b54"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#a6e9df"/><stop offset="1" stop-color="#2486a1"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="windows" width="15" height="18" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="5" height="7" rx="1" fill="#c9f4e9" opacity=".7"/></pattern>
</defs>
