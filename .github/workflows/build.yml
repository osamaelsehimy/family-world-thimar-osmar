name: Build MVP

on:
  push:
    branches: [main, codex/family-world-mvp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Verify installable PWA output
        run: npm run test:pwa
      - uses: actions/upload-artifact@v4
        with:
          name: family-world-mvp-dist
          path: dist/
          if-no-files-found: error
