name: Build MVP

on:
  push:
    branches: [main, codex/family-world-mvp]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: family-world-mvp-dist
          path: dist/
          if-no-files-found: error
